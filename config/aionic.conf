port = 8080
thread_count = 4
max_connections = 1024
request_timeout = 30000
buffer_size = 8192
max_request_size = 33554432
log_file = logs/aionic.log
enable_cache = 1
cache_size = 1000
cache_ttl = 3600
enable_firewall = 1
enable_optimization = 1
verify_ssl = 1
api_key = your-secret-api-key-here

# ===== New Engine Options =====
enable_iouring = 1
enable_zero_copy = 1
enable_ratelimiter = 1
rate_limit_rps = 100
enable_observability = 1
enable_streaming = 1
enable_smart_routing = 1
enable_keepalive = 1
keepalive_timeout = 30
worker_threads = 4

# ===== AI Models =====
