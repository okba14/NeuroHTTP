port = 8080
tls_port = 8443
thread_count = 4
max_connections = 1024
request_timeout = 30000
buffer_size = 8192
max_request_size = 33554432
log_file = logs/aionic.log
enable_cache = 1
cache_size = 1000
cache_ttl = 3600
enable_firewall = 1
enable_optimization = 1
verify_ssl = 1
api_key = your-secret-api-key-here

# ===== Engine Options =====
enable_iouring = 1
iouring_queue_depth = 512
iouring_sqpoll = 0
enable_zero_copy = 1
enable_ratelimiter = 1
rate_limit_rps = 100
enable_observability = 1
enable_streaming = 1
enable_smart_routing = 1
enable_keepalive = 1
keepalive_timeout = 30
worker_threads = 4

# ===== TLS/SSL Options (OpenSSL 3.x) =====
enable_tls = 0
tls_cert_file = config/cert.pem
tls_key_file = config/key.pem
tls_ca_file =
tls_ca_path =
tls_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
tls_ciphersuites_tls13 = TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
tls_min_version = 2
tls_prefer_server_ciphers = 1
tls_verify_client = 0
tls_verify_depth = 10
tls_enable_ocsp = 0
tls_ocsp_refresh_interval = 3600
tls_session_cache_size = 2048
tls_enable_renegotiation = 0
tls_enable_early_data = 0
tls_hsts_max_age = 31536000
tls_hsts_include_subdomains = 1
tls_alpn_protocols = h2,http/1.1

# ===== HTTP/2 Options =====
enable_http2 = 1
http2_max_concurrent_streams = 256
http2_max_header_list_size = 65536
http2_initial_window_size = 65535
http2_max_frame_size = 16384
http2_enable_push = 0

# ===== Graceful Shutdown =====
graceful_shutdown_timeout = 30

# ===== AI Models =====
ai_model = llama-3.3-70b-versatile|https://api.groq.com/openai/v1/chat/completions|GROQ_API_KEY|8192|0.7|2
ai_model = llama-3.1-8b-instant|https://api.groq.com/openai/v1/chat/completions|GROQ_API_KEY|8192|0.7|1
ai_model = gemma2-9b-it|https://api.groq.com/openai/v1/chat/completions|GROQ_API_KEY|8192|0.7|1
ai_model = mixtral-8x7b-32768|https://api.groq.com/openai/v1/chat/completions|GROQ_API_KEY|32768|0.7|2

